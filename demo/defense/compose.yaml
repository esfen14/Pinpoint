    "dhcp01": {
      "image": "${PINPOINT_DEFENSE_IMAGE:?pinned image ID required}",
      "container_name": "pinpoint-defense274-dhcp01",
      "hostname": "dhcp01",
      "network_mode": "none",
      "restart": "no",
      "command": [
        "python3",
        "/opt/pinpoint/defense/node.py",
        "init",
        "dhcp01"
      ],
      "labels": {
        "org.pinpoint.defense.issue": "274",
        "org.pinpoint.defense.owner": "${PINPOINT_DEFENSE_OWNER:?managed project owner required}",
        "org.pinpoint.defense.target": "dhcp01"
      },
      "volumes": [
        {
          "type": "bind",
          "source": "/var/lib/pinpoint-defense/identities/dhcp01",
          "target": "/identity",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/var/lib/pinpoint-defense/data/dhcp01",
          "target": "/data",
          "read_only": false,
          "bind": {
            "create_host_path": false
          }
        },
        {
          "type": "bind",
          "source": "/var/lib/pinpoint-defense/context.json",
          "target": "/etc/pinpoint-defense/context.json",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "tmpfs": [
        "/run:rw,nosuid,nodev,size=16m,mode=0755"
      ],
      "mem_limit": "64m",
      "pids_limit": 96,
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "1m",
          "max-file": "2"
